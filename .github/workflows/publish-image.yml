name: Publish image

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      source_sha:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
      - uses: docker/setup-buildx-action@v4

      - name: Validate release secrets
        env:
          DEPLOYMENT_REPOSITORY: ${{ secrets.CINEKO_DEPLOYMENT_REPOSITORY }}
          DEPLOYMENT_TOKEN: ${{ secrets.CINEKO_DEPLOYMENT_TOKEN }}
          IMAGE: ${{ secrets.CINEKO_IMAGE }}
          REGISTRY: ${{ secrets.CINEKO_REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.CINEKO_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.CINEKO_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in \
            "$DEPLOYMENT_REPOSITORY" \
            "$DEPLOYMENT_TOKEN" \
            "$IMAGE" \
            "$REGISTRY" \
            "$REGISTRY_USERNAME" \
            "$REGISTRY_PASSWORD"; do
            if [[ -z "$value" ]]; then
              echo "required Repository Secret is missing" >&2
              exit 1
            fi
          done

      - name: Authenticate to the image registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.CINEKO_REGISTRY }}
          username: ${{ secrets.CINEKO_REGISTRY_USERNAME }}
          password: ${{ secrets.CINEKO_REGISTRY_PASSWORD }}

      - name: Resolve immutable image tag
        id: image
        run: |
          set -euo pipefail
          source_sha='${{ inputs.source_sha }}'
          release_tag='${{ inputs.release_tag }}'
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release source SHA is invalid" >&2
            exit 1
          fi
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a semantic version" >&2
            exit 1
          fi
          if [[ "$release_tag" != "v${version}" ]]; then
            echo "release tag ${release_tag} does not match VERSION ${version}" >&2
            exit 1
          fi
          echo "tag=sha-${source_sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: CINEKO_VERSION=${{ steps.image.outputs.version }}
          tags: ${{ secrets.CINEKO_IMAGE }}:${{ steps.image.outputs.tag }}

      - name: Request immutable deployment
        env:
          TARGET: cineko-central
          DEPLOYMENT_REPOSITORY: ${{ secrets.CINEKO_DEPLOYMENT_REPOSITORY }}
          GH_TOKEN: ${{ secrets.CINEKO_DEPLOYMENT_TOKEN }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${DEPLOYMENT_REPOSITORY}/dispatches" \
            -f event_type=image-published \
            -f "client_payload[target]=$TARGET" \
            -f "client_payload[digest]=$IMAGE_DIGEST" \
            -f "client_payload[tag]=$IMAGE_TAG" \
            -f "client_payload[version]=${{ inputs.release_tag }}" \
            -f "client_payload[source_repository]=$GITHUB_REPOSITORY" \
            -f "client_payload[source_sha]=${{ inputs.source_sha }}"
